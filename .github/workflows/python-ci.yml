name: python-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Sync
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check phaseforge tests scripts
      - name: Tests
        run: uv run pytest --cov=phaseforge --cov-report=term-missing
      - name: Reproduce smoke (no UQ)
        run: uv run python scripts/reproduce_all.py --skip-uq
