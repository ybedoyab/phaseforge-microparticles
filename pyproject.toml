[project]
name = "phaseforge"
version = "0.1.0"
description = "Computational proof-of-concept for PhaseForge: thermally latent fluid-to-microparticle transformation under HPHT conditions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "PhaseForge computational team" },
]
keywords = [
  "microparticles",
  "ROMP",
  "DCPD",
  "in-situ proppant",
  "uncertainty quantification",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "pint>=0.23",
  "pydantic>=2.6",
  "SALib>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
cfd3d = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "pyvista>=0.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phaseforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["phaseforge", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402"]

[tool.coverage.run]
source = ["phaseforge"]
omit = ["phaseforge/reporting.py", "phaseforge/chemgate_figures.py"]

[tool.coverage.report]
fail_under = 55
show_missing = true
